# Builds the release APK on every push and pull request. There is no test suite; that the app
# compiles and assembles is the check. The APK is kept as an artifact so a build can be tried on
# a phone without a local toolchain.
#
# A tagged release (a tag like v1.0.0) also attaches the APK to the GitHub release, which is what
# the site and the README link to as the free download.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # needed only by the release step; the build itself reads.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # AGP 8.7 builds against platform 36 with build-tools 35.0.0. Install just those so the
      # first run does not stop to fetch them.
      - name: Install the SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build the release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: overkey-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Only when a version tag is pushed. The APK here is signed with the debug key; a real
      # release is signed elsewhere, so this attaches the build for testing, not for the stores.
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
