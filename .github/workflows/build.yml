# Builds the release APK on every push and pull request. There is no test suite; that the app
# compiles and assembles is the check. The APK is kept as an artifact so a build can be tried on
# a phone without a local toolchain.
#
# A tagged release (a tag like v1.0.0) also attaches the APK to the GitHub release, but only when
# a real signing key is configured. Without one the build falls back to a debug key that the
# runner generates fresh every time, and publishing that would hand every release a different
# signature, so the next one could not be installed over the last. To publish signed builds, put
# the keystore and its passwords in repository secrets:
#
#   OVERKEY_KEYSTORE_BASE64   base64 of the .jks   (base64 -w0 release.jks)
#   OVERKEY_STORE_PASSWORD    the store password
#   OVERKEY_KEY_ALIAS         the key alias
#   OVERKEY_KEY_PASSWORD      the key password
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Read only by default. The one job that needs to write does so with its own grant, so a build
# of a pull request never runs with a token that could push a release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # AGP 8.7 builds against platform 36 with build-tools 35.0.0. Install just those so the
      # first run does not stop to fetch them.
      - name: Install the SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Written outside the checkout so it cannot end up in the build, and removed with the
      # runner. Without the secret this writes nothing and the build falls back to the debug key.
      - name: Unpack the signing key
        id: sign
        env:
          KEYSTORE: ${{ secrets.OVERKEY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            umask 077
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key set; the release build will use a throwaway debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release APK
        env:
          OVERKEY_STORE_FILE: ${{ steps.sign.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          OVERKEY_STORE_PASSWORD: ${{ secrets.OVERKEY_STORE_PASSWORD }}
          OVERKEY_KEY_ALIAS: ${{ secrets.OVERKEY_KEY_ALIAS }}
          OVERKEY_KEY_PASSWORD: ${{ secrets.OVERKEY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: overkey-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Its own job so that `contents: write` is nowhere near the build of a pull request. Skipped
  # unless a version tag was pushed and the APK was signed with the real key.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed only to read the tag object; fetch-depth 0 brings the tags with it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: overkey-release

      # Where the release notes come from. An annotated tag carries its own message, so that
      # is used:
      #
      #     git tag -a v1.0.1 -m "What changed" && git push origin v1.0.1
      #
      # A lightweight tag (plain `git tag v1.0.1`) carries nothing, and its ref points at a
      # commit, so anything reading the ref's contents gets that commit's message: an
      # internal change nobody chose as the notes. Those get a placeholder to edit instead,
      # which is why the object type is checked rather than whether the text is empty.
      - name: Read the tag's own message
        id: notes
        run: |
          # checkout peels the pushed tag to its commit; fetch the tag object itself back.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          kind=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype)')
          if [ "$kind" = "tag" ]; then
            body=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')
          else
            body="Overkey ${GITHUB_REF_NAME}. Release notes to follow."
          fi
          {
            echo "body<<OVERKEY_EOF"
            echo "$body"
            echo "OVERKEY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          name: Overkey ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
